name: Enforce Pages HTTPS

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enforce-https:
    runs-on: ubuntu-latest
    steps:
      - name: Enable HTTPS when certificate is ready
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          pages=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GH_REPO/pages")

          if [[ $(jq -r '.https_enforced' <<<"$pages") == "true" ]]; then
            echo "HTTPS enforcement is already enabled."
            exit 0
          fi

          certificate_state=$(jq -r '.https_certificate.state // "pending"' <<<"$pages")
          if [[ "$certificate_state" != "approved" ]]; then
            echo "Pages certificate is not ready (state: $certificate_state); will retry later."
            exit 0
          fi

          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -F https_enforced=true \
            "/repos/$GH_REPO/pages" \
            >/dev/null

          echo "HTTPS enforcement enabled."
